<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الاشتراكات — ZIKEH STORE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#062A57">
<link rel="icon" href="logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=0c5da90c">
</head>
<body class="auth-page">
<div class="auth-bg" aria-hidden="true"></div>

<main class="adm-shell">
  <header class="adm-top">
    <a class="acc-top" href="./" aria-label="ZIKEH STORE — الصفحة الرئيسية">
      <span class="auth-logo-ring sm"><img src="icons/icon-192.png" alt="" width="48" height="48"></span>
      <span class="adm-title">
        <span class="auth-wordmark sm ltr"><span class="z-red">ZIKEH</span> STORE</span>
        <span class="adm-sub">لوحة إدارة الاشتراكات</span>
      </span>
    </a>
    <nav class="adm-nav" aria-label="روابط">
      <a class="adm-navbtn" href="account.html">حسابي</a>
      <a class="adm-navbtn" href="./">الموقع</a>
    </nav>
  </header>

  <div class="acc-loading adm-glass" id="gateMsg" role="status"><span class="acc-spinner" aria-hidden="true"></span>عم نتأكد من صلاحياتك…</div>
  <p class="auth-msg err" id="gateErr" role="alert" hidden></p>

  <div id="adminBody" class="adm-body" hidden>
    <!-- أرقام سريعة -->
    <div class="adm-stats">
      <div class="adm-stat">
        <span class="adm-stat-ic ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <span class="adm-stat-txt"><b id="statActive">0</b><span>مشترك ساري</span></span>
      </div>
      <div class="adm-stat">
        <span class="adm-stat-ic soon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
        <span class="adm-stat-txt"><b id="statSoon">0</b><span>بيخلصوا خلال 7 أيام</span></span>
      </div>
    </div>

    <!-- بحث -->
    <section class="auth-panel adm-panel" aria-labelledby="findTitle">
      <header class="adm-panel-head">
        <h2 id="findTitle">بحث عن زبون</h2>
        <p>اكتب رقم الزبون أو جزء من الإيميل</p>
      </header>
      <form class="adm-search" id="findForm" novalidate>
        <span class="auth-input">
          <svg class="in-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          <input id="findQ" class="ltr" placeholder="ZK-4821  أو  name@gmail.com" autocomplete="off" aria-label="رقم الزبون أو الإيميل">
        </span>
        <button class="auth-submit adm-search-btn" type="submit"><span>بحث</span></button>
      </form>
      <p class="auth-msg err" id="findErr" role="alert" hidden></p>
      <div id="findResults" class="adm-cards"></div>
    </section>

    <!-- المشتركين -->
    <section class="auth-panel adm-panel" aria-labelledby="listTitle">
      <header class="adm-panel-head row">
        <div>
          <h2 id="listTitle">المشتركين <span class="adm-count" id="listCount"></span></h2>
          <p>مرتّبين حسب تاريخ الانتهاء</p>
        </div>
        <div class="auth-tabs adm-filter" role="tablist" aria-label="تصفية" id="listFilter" data-active="all">
          <span class="auth-tabs-pill" aria-hidden="true"></span>
          <button type="button" role="tab" data-f="all" aria-selected="true">الكل</button>
          <button type="button" role="tab" data-f="soon" aria-selected="false">قرّبوا يخلصوا</button>
        </div>
      </header>
      <div id="subsList" class="adm-cards"></div>
    </section>
  </div>
</main>

<script src="auth-config.js?v=0c5da90c"></script>
<script src="auth.js?v=0c5da90c"></script>
<script>
(function () {
  const A = window.ZikehAuth;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const COLS = 'id, customer_no, email, created_at, sub_expires_at, admin_notes';
  let sb = null;
  let listFilter = 'all';
  let listRows = [];
  const cards = new Map();                       // id ← آخر نسخة من الزبون

  function gate(text) { $('gateMsg').hidden = true; $('gateErr').hidden = false; $('gateErr').textContent = text; }
  if (!A.enabled) return gate('الحسابات لسا ما انربطت بالموقع.');

  function statusText(p) {
    const st = A.subStatus(p.sub_expires_at);
    if (st.key === 'none') return { st, text: 'غير مشترك' };
    if (st.key === 'expired') return { st, text: 'منتهي من ' + A.fmtDate(st.end) };
    return { st, text: 'ساري لحد ' + A.fmtDate(st.end) + ' · باقي ' + A.daysText(st.days) };
  }

  function card(p) {
    cards.set(p.id, p);
    const { st, text } = statusText(p);
    return '<article class="sub-card adm-card" data-id="' + esc(p.id) + '" data-state="' + st.key + '">' +
      '<div class="adm-card-head">' +
        '<b class="adm-no ltr">' + esc(p.customer_no) + '</b>' +
        '<span class="sub-pill" data-state="' + st.key + '">' + esc(text) + '</span>' +
      '</div>' +
      '<div class="adm-meta">' +
        '<span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg><span class="ltr">' + esc(p.email) + '</span></span>' +
        '<span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>سجّل بـ <span class="ltr">' + esc(A.fmtDate(p.created_at)) + '</span></span>' +
      '</div>' +
      '<div class="adm-actions">' +
        '<button class="adm-add" type="button" data-act="m1">+ شهر</button>' +
        '<button class="adm-add" type="button" data-act="m3">+ 3 أشهر</button>' +
        '<button class="adm-add" type="button" data-act="m12">+ سنة</button>' +
      '</div>' +
      '<div class="adm-row">' +
        '<span class="custom-date adm-date"><input type="date" aria-label="تاريخ انتهاء مخصص">' +
        '<button class="adm-mini" type="button" data-act="date">حفظ التاريخ</button></span>' +
        '<button class="adm-mini danger" type="button" data-act="cancel"' + (st.key === 'none' ? ' disabled' : '') + '>إلغاء الاشتراك</button>' +
      '</div>' +
      '<details class="adm-notes"' + (p.admin_notes ? ' open' : '') + '><summary>ملاحظات (بتبين إلك بس)</summary>' +
        '<textarea rows="2" placeholder="مثلاً: دفع 10$ كاش">' + esc(p.admin_notes || '') + '</textarea>' +
        '<button class="adm-mini" type="button" data-act="notes">حفظ الملاحظات</button></details>' +
      '<p class="card-msg" role="status" hidden></p>' +
      '</article>';
  }

  function drawList() {
    const soon = listRows.filter(p => A.subStatus(p.sub_expires_at).key === 'soon');
    $('statActive').textContent = listRows.length;
    $('statSoon').textContent = soon.length;
    const rows = listFilter === 'soon' ? soon : listRows;
    $('listCount').textContent = rows.length;
    $('subsList').innerHTML = rows.length ? rows.map(card).join('')
      : '<p class="adm-empty">' + (listFilter === 'soon' ? 'ما حدا اشتراكو قرّب يخلص 👌' : 'ما في مشتركين لهلأ.') + '</p>';
  }

  async function loadList() {
    const { data, error } = await sb.from('profiles').select(COLS)
      .gt('sub_expires_at', new Date().toISOString()).order('sub_expires_at', { ascending: true }).limit(1000);
    if (error) throw error;
    listRows = data;
    drawList();
  }

  $('listFilter').addEventListener('click', e => {
    const b = e.target.closest('button[data-f]');
    if (!b) return;
    listFilter = b.dataset.f;
    $('listFilter').dataset.active = listFilter === 'soon' ? 'signup' : 'login';
    $('listFilter').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    drawList();
  });
  $('listFilter').dataset.active = 'login';

  async function find(q) {
    $('findErr').hidden = true;
    // بس أحرف الإيميل ورقم الزبون (حتى ما ينكسر فلتر البحث)
    const clean = q.trim().replace(/[^A-Za-z0-9@._+-]/g, '');
    if (clean.length < 2) { $('findErr').hidden = false; $('findErr').textContent = 'اكتب رقم الزبون أو جزء من الإيميل (حرفين أو أكتر).'; return; }
    const num = clean.replace(/^zk-?/i, '');
    let query = sb.from('profiles').select(COLS);
    query = /^\d{2,5}$/.test(num)
      ? query.or('customer_no.ilike.%' + num + '%,email.ilike.%' + clean + '%')
      : query.ilike('email', '%' + clean + '%');
    const { data, error } = await query.order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    $('findResults').innerHTML = data.length ? data.map(card).join('') : '<p class="adm-empty">ما لقينا زبون بهالرقم أو الإيميل.</p>';
  }

  $('findForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.classList.add('is-busy');
    find($('findQ').value)
      .catch(err => { $('findErr').hidden = false; $('findErr').textContent = A.arError(err); })
      .finally(() => { btn.disabled = false; btn.classList.remove('is-busy'); });
  });

  // أزرار كل زبون
  document.addEventListener('click', async e => {
    const btn = e.target.closest('.sub-card [data-act]');
    if (!btn) return;
    const el = btn.closest('.sub-card');
    const id = el.dataset.id;
    const p = cards.get(id);
    const out = el.querySelector('.card-msg');
    const say = (ok, t) => { out.hidden = false; out.textContent = t; out.dataset.ok = ok ? '1' : '0'; };
    let call;
    const act = btn.dataset.act;
    if (act === 'm1' || act === 'm3' || act === 'm12') {
      call = sb.rpc('admin_extend', { p_user: id, p_months: { m1: 1, m3: 3, m12: 12 }[act] });
    } else if (act === 'date') {
      const v = el.querySelector('input[type="date"]').value;
      if (!v) return say(false, 'اختار التاريخ أول شي.');
      const until = new Date(v + 'T23:59:59');
      call = sb.rpc('admin_set_expiry', { p_user: id, p_until: until.toISOString() });
    } else if (act === 'cancel') {
      if (!confirm('أكيد بدك تلغي اشتراك ' + p.customer_no + '؟')) return;
      call = sb.rpc('admin_set_expiry', { p_user: id, p_until: null });
    } else if (act === 'notes') {
      call = sb.from('profiles').update({ admin_notes: el.querySelector('textarea').value.trim() || null }).eq('id', id).select(COLS).single();
    }
    el.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
      const { data, error } = await call;
      if (error) throw error;
      const fresh = Array.isArray(data) ? data[0] : data;
      // نفس الزبون ممكن يكون بنتيجة البحث وبالقائمة: منحدّث التنين
      document.querySelectorAll('.sub-card[data-id="' + id + '"]').forEach(c => { c.outerHTML = card(fresh); });
      await loadList();
      const again = document.querySelector('#findResults .sub-card[data-id="' + id + '"]') || document.querySelector('.sub-card[data-id="' + id + '"]');
      if (again) {
        const m = again.querySelector('.card-msg');
        m.hidden = false; m.dataset.ok = '1';
        m.textContent = act === 'notes' ? 'انحفظت الملاحظات ✓' : act === 'cancel' ? 'انلغى الاشتراك ✓' : 'تمام ✓ ' + statusText(fresh).text;
      }
    } catch (err) {
      say(false, A.arError(err));
      el.querySelectorAll('button').forEach(b => { b.disabled = false; });
    }
  });

  A.client().then(async client => {
    sb = client;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('login.html?next=subs.html');
    const { data: isAdmin, error } = await sb.rpc('is_admin');
    if (error) throw error;
    if (!isAdmin) return gate('هالصفحة للأدمن بس.');
    $('gateMsg').hidden = true;
    $('adminBody').hidden = false;
    await loadList();
  }).catch(e => gate(A.arError(e)));
})();
</script>
</body>
</html>
